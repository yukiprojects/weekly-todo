
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Weekly ToDo</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:38px 24px;
  padding-top:calc(38px + env(safe-area-inset-top));
  padding-bottom:calc(38px + env(safe-area-inset-bottom));
  background:#111;
  color:white;
  font-family:-apple-system,sans-serif;
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
}

.calendar-icon {
  width:34px;
  height:34px;
  color:#75d69b;
  flex-shrink:0;
}

h1 {
  font-size:32px;
  letter-spacing:3px;
  margin:0;
}

.sub {
  color:#888;
  font-size:11px;
  margin-top:6px;
}

.progress {
  color:#75d69b;
  font-size:12px;
}

.weekdays {
  display:flex;
  justify-content:space-between;
  margin-top:30px;
  padding:0 5px;
}

.day {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  color:#777;
  font-size:10px;
}

.day-date {
  color:white;
  font-size:13px;
  font-weight:600;
}

.day-dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:#444;
}

.day-dot.active {
  background:#75d69b;
}

.section {
  color:#888;
  font-size:11px;
  letter-spacing:1.5px;
  margin:38px 0 22px;
}

.task {
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:23px;
  font-size:15px;
  position:relative;
  transition:opacity .12s;
  touch-action:pan-y;
}

.circle {
  width:20px;
  height:20px;
  border:1px solid #777;
  border-radius:50%;
  flex-shrink:0;
}

.done .circle {
  background:#75d69b;
  border-color:#75d69b;
}

.done .task-name {
  opacity:.4;
  text-decoration:line-through;
}

.task-name {
  flex:1;
}

.remove {
  color:#777;
  font-size:22px;
  padding:0 5px;
  cursor:pointer;
}

.empty-state {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:55px 15px 45px;
  color:#888;
}

.empty-icon {
  width:48px;
  height:48px;
  margin-bottom:20px;
  color:#666;
}

.empty-title {
  color:#ddd;
  font-size:16px;
  font-weight:600;
  margin-bottom:9px;
}

.empty-description {
  color:#777;
  font-size:13px;
}

.add-area {
  display:flex;
  gap:8px;
  margin-top:30px;
}

input {
  min-width:0;
  flex:1;
  background:#222;
  border:1px solid #444;
  border-radius:9px;
  padding:13px;
  color:white;
  font-size:16px;
  -webkit-appearance:none;
}

button {
  background:#75d69b;
  color:#111;
  border:0;
  border-radius:9px;
  padding:0 17px;
  font-weight:600;
}

.task.dragging {
  opacity:.35;
}

.task.drag-target {
  padding-bottom:0;
  border-bottom:0;
}

.task.drag-target::after {
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:100%;
  height:2px;
  background:#75d69b;
  transform:translateY(10px);
  pointer-events:none;
}

body.dragging {
  user-select:none;
  -webkit-user-select:none;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <svg class="calendar-icon" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M16 3v4M8 3v4M3 10h18"/>
      <path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/>
    </svg>
    <div>
      <h1>WEEKLY</h1>
      <div class="sub" id="period"></div>
    </div>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="weekdays" id="weekdays"></div>

<div class="section">TO DO LIST</div>
<div id="list"></div>

<div class="add-area">
  <input id="newTask" placeholder="New task..." />
  <button onclick="addTask()">＋</button>
</div>

<script>

// =====================================
// APP VERSION
// =====================================

// 新しいコードを公開するときは、この番号を変更する
const APP_VERSION = "2026-11-14-2";


// =====================================
// AUTO UPDATE CHECK
// =====================================

async function checkForUpdates() {
  try {
    const checkURL = new URL(location.pathname, location.origin);

    // キャッシュを避けて最新HTMLを取得
    checkURL.searchParams.set("_update_check", Date.now());

    const response = await fetch(checkURL.toString(), {
      cache: "no-store"
    });

    if (!response.ok) return;

    const html = await response.text();

    // 最新HTML内のバージョン番号を取得
    const match = html.match(
      /const APP_VERSION = ["']([^"']+)["'];/
    );

    if (!match) return;

    const latestVersion = match[1];

    // バージョンが違う場合だけ更新
    if (latestVersion !== APP_VERSION) {

      const updateURL = new URL(location.href);

      updateURL.searchParams.set("v", latestVersion);
      updateURL.searchParams.delete("_update_check");

      location.replace(updateURL.toString());
    }

  } catch (error) {
    // 更新確認に失敗しても通常利用は継続
    console.log("Update check skipped:", error);
  }
}


// =====================================
// TASK DATA
// =====================================

const STORAGE_KEY = "weekly-todo-data";

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + d;
}

function getMonday(date) {
  const monday = new Date(date);
  const day = (monday.getDay()+6)%7;
  monday.setDate(monday.getDate()-day);
  monday.setHours(0,0,0,0);
  return monday;
}

const currentWeekStart = dateKey(getMonday(new Date()));

let tasks = [];
let savedWeekStart = currentWeekStart;


// 保存データの読み込み
try {
  const stored = localStorage.getItem(STORAGE_KEY);

  if (stored) {
    const data = JSON.parse(stored);

    if (Array.isArray(data)) {
      tasks = data;
    } else {
      tasks = Array.isArray(data.tasks) ? data.tasks : [];
      savedWeekStart = data.weekStart || currentWeekStart;
    }
  }
} catch(e) {
  console.error("Data loading error:", e);
}


// 新しい週になっていたら未完了タスクだけ残す
if (savedWeekStart !== currentWeekStart) {
  tasks = tasks.filter(t => !t.done);
  tasks.forEach(t => delete t.completedAt);
  savedWeekStart = currentWeekStart;
}


// 未完了・完了の順番に統一
sortTasks();

function sortTasks() {
  tasks = [
    ...tasks.filter(t => !t.done),
    ...tasks.filter(t => t.done)
  ];
}


// 保存
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      weekStart: currentWeekStart,
      tasks: tasks
    }));
  } catch(e) {
    console.error("Data saving error:", e);
    alert("Could not save data.");
  }
}


// 初回または週更新時の保存
save();


// =====================================
// WEEK DISPLAY
// =====================================

function getWeekDates() {
  const monday = getMonday(new Date());

  return Array.from({length:7},(_,i)=>{
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    return d;
  });
}

const weekDates = getWeekDates();

function formatDate(date) {
  return date.toLocaleDateString("en-US", {
    month:"short",
    day:"numeric"
  });
}

document.getElementById("period").textContent =
  formatDate(weekDates[0]) + " — " +
  formatDate(weekDates[6]) + ", " +
  weekDates[6].getFullYear();


// =====================================
// RENDER
// =====================================

function render() {
  const done = tasks.filter(t=>t.done).length;

  document.getElementById("progress").textContent =
    done + " / " + tasks.length + " DONE";

  document.getElementById("weekdays").innerHTML =
    weekDates.map((date,i)=>{
      const key = dateKey(date);
      const active = tasks.some(t=>t.completedAt===key);

      return `
        <div class="day">
          <span class="day-date">${date.getDate()}</span>
          <span>${["MON","TUE","WED","THU","FRI","SAT","SUN"][i]}</span>
          <div class="day-dot ${active?'active':''}"></div>
        </div>
      `;
    }).join("");

  document.getElementById("list").innerHTML =
    tasks.length === 0
      ? `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M16 3v4M8 3v4M3 10h18"/>
            <path d="M8 14h.01M12 14h.01M16 14h.01"/>
          </svg>
          <div class="empty-title">No tasks yet</div>
          <div class="empty-description">
            Add your first task to get started.
          </div>
        </div>
      `
      : tasks.map((t,i)=>`
        <div class="task ${t.done?'done':''}" data-index="${i}">
          <div class="circle" onclick="toggle(${i})"></div>
          <span class="task-name">${escapeHTML(t.name)}</span>
          <span class="remove" onclick="removeTask(${i})">×</span>
        </div>
      `).join("");

  setupDrag();
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}


// =====================================
// TOGGLE TASK
// =====================================

function toggle(i) {
  const task = tasks[i];

  if (!task) return;

  task.done = !task.done;

  if (task.done) {
    task.completedAt = dateKey(new Date());
  } else {
    delete task.completedAt;
  }

  sortTasks();

  render();
  save();
}


// =====================================
// ADD TASK
// =====================================

function addTask() {
  const input = document.getElementById("newTask");
  const name = input.value.trim();

  if (!name) return;

  const task = {
    name:name,
    done:false
  };

  // 未完了グループの最後に追加
  const firstDone = tasks.findIndex(t => t.done);

  if (firstDone === -1) {
    tasks.push(task);
  } else {
    tasks.splice(firstDone, 0, task);
  }

  input.value = "";
  render();
  save();
}


// =====================================
// REMOVE TASK
// =====================================

function removeTask(i) {
  if (i < 0 || i >= tasks.length) return;

  tasks.splice(i,1);
  render();
  save();
}


// =====================================
// DRAG AND DROP
// =====================================

let dragIndex = null;
let dragStarted = false;
let pressTimer = null;
let startY = 0;

function setupDrag() {
  const rows = document.querySelectorAll(".task");

  rows.forEach(row => {

    row.addEventListener("touchstart", e => {
      if (e.target.closest(".circle") ||
          e.target.closest(".remove")) return;

      const touch = e.touches[0];

      dragIndex = Number(row.dataset.index);
      startY = touch.clientY;
      dragStarted = false;

      clearTimeout(pressTimer);

      pressTimer = setTimeout(() => {
        dragStarted = true;
        row.classList.add("dragging");
        document.body.classList.add("dragging");
      }, 300);

    }, {passive:true});


    row.addEventListener("touchmove", e => {
      const touch = e.touches[0];

      if (!dragStarted) {
        if (Math.abs(touch.clientY-startY)>10) {
          clearTimeout(pressTimer);
        }
        return;
      }

      e.preventDefault();

      const target = document.elementFromPoint(
        touch.clientX,
        touch.clientY
      );

      const targetRow = target
        ? target.closest(".task")
        : null;

      document.querySelectorAll(".task").forEach(r => {
        r.classList.remove("drag-target");
      });

      if (targetRow) {
        const targetIndex = Number(targetRow.dataset.index);

        if (targetIndex !== dragIndex) {
          targetRow.classList.add("drag-target");
        }
      }

    }, {passive:false});


    row.addEventListener("touchend", e => {
      clearTimeout(pressTimer);

      if (!dragStarted) {
        dragIndex = null;
        return;
      }

      const touch = e.changedTouches[0];

      const target = document.elementFromPoint(
        touch.clientX,
        touch.clientY
      );

      const targetRow = target
        ? target.closest(".task")
        : null;

      if (targetRow) {
        const targetIndex = Number(targetRow.dataset.index);

        if (
          targetIndex !== dragIndex &&
          tasks[dragIndex] &&
          tasks[targetIndex] &&
          tasks[dragIndex].done === tasks[targetIndex].done
        ) {
          const moved = tasks.splice(dragIndex,1)[0];

          const insertIndex = targetIndex > dragIndex
            ? targetIndex
            : targetIndex;

          tasks.splice(insertIndex,0,moved);

          sortTasks();
          save();
        }
      }

      dragIndex = null;
      dragStarted = false;
      document.body.classList.remove("dragging");

      render();

    }, {passive:true});


    row.addEventListener("touchcancel", () => {
      clearTimeout(pressTimer);

      if (dragStarted) {
        dragIndex = null;
        dragStarted = false;
        document.body.classList.remove("dragging");
        render();
      }
    });

  });
}


// =====================================
// START APP
// =====================================

render();

// 起動後にバックグラウンドで更新確認
checkForUpdates();

</script>

</body>
</html>
